  <!-- ==================== WADAH APLIKASI UTAMA ==================== -->
  <div id="appShell" class="app-shell">
    <!-- HEADER ATAS (DESKTOP & MOBILE) -->
    <header class="app-header">
      <div class="header-main container">
        <!-- Logo dan Subjudul Aplikasi -->
        <div class="brand">
          <img src="IMKLogo.png" alt="SmashQueue Pro" class="header-logo-img" />
          <p class="brand-sub desktop-only">Sistem Pengelolaan Antrean &amp; Sesi Bulu Tangkis</p>
        </div>

        <!-- Navigasi Desktop dengan Indikator Bergeser -->
        <nav class="desktop-nav" id="desktopNav" aria-label="Navigasi Utama">
          <div class="nav-indicator" id="navIndicator"></div>
          <button class="nav-pill active" data-view="dashboard">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            <span>Dashboard Utama</span>
          </button>
          <button class="nav-pill" data-view="players">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Data Pemain</span>
          </button>
          <button class="nav-pill" data-view="generator">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8 19 13"/><path d="M15 9h0"/><path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5"/></svg>
            <span>Generator Antrean</span>
          </button>
          <button class="nav-pill" data-view="sessions">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Sesi Pemain</span>
          </button>
          <button class="nav-pill" data-view="payment">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span>Pembayaran &amp; Riwayat</span>
          </button>
        </nav>

        <!-- Profil Admin dan Menu Keluar -->
        <div class="admin-profile">
          <div class="admin-info desktop-only">
            <div class="admin-name"><span class="dot-green"></span> David</div>
            <div class="admin-time" id="liveClock">--:--:-- WIB</div>
          </div>
          <div class="admin-menu-wrap">
            <button
              class="avatar-btn"
              id="btnAdminInfo"
              aria-expanded="false"
              aria-haspopup="true"
              title="David"
            >
              DA
            </button>
            <div class="admin-popover" id="adminPopover">
              <div class="admin-popover-head">
                <strong>David</strong>
                <span>david.admin</span>
              </div>
              <button type="button" class="popover-item" id="btnResetData">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                <span>Reset Semua Data</span>
              </button>
              <button type="button" class="popover-item danger" id="btnLogout">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Keluar (Logout)</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Bilah Ringkasan Status (Desktop) -->
      <div class="status-bar desktop-only">
        <div class="status-bar-inner container">
          <div class="status-metrics">
            <span class="metric-item">Pemain Terdaftar: <strong class="pill-count neutral" id="topTotal">0</strong></span>
            <span class="metric-item">
              <span class="dot-blue"></span> Siap/Menunggu: <strong class="pill-count blue" id="topWaiting">0</strong>
            </span>
            <span class="metric-item">
              <span class="dot-green"></span> Sedang Bermain: <strong class="pill-count green" id="topPlaying">0</strong>
            </span>
            <span class="metric-item">
              <span class="dot-amber"></span> Istirahat: <strong class="pill-count amber" id="topResting">0</strong>
            </span>
          </div>
          <div class="status-actions">
            <span class="court-status-pill available" id="topCourtStatus">● Lapangan Terpakai 0/2 (Kosong)</span>
            <button class="btn-autorotate active" id="btnAutoRotate" title="Otomatis masukkan antrean saat pertandingan selesai">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              <span>Auto-Rotate</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="app-main container">
